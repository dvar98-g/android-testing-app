# Copiar este archivo como config.properties (mismo directorio) y completar con valores reales.
# config.properties NUNCA se commitea (ver .gitignore).
#
# Toda propiedad puede sobreescribirse mediante variable de entorno.
# Prioridad de resolucion: variable de entorno > config.properties > valor por defecto (si aplica).

# Appium server
# Env var: APPIUM_SERVER_URL
appium.server.url=http://127.0.0.1:4723

# Ruta ABSOLUTA al .apk descargado
# Env var: APP_PATH
app.path=/absolute/path/to/native-demo-app.apk

# Device / platform capabilities
# Env var: PLATFORM_NAME
platform.name=PLATFORM
# Env var: PLATFORM_VERSION
platform.version=VERSION
# Env var: DEVICE_NAME
device.name=NAME
# Env var: UDID
udid=NAME UDID
# Env var: AUTOMATION_NAME
automation.name=

# Waits (solo esperas explicitas, no se usa wait implicito)
# Env var: EXPLICIT_WAIT_SECONDS
explicit.wait.seconds=15

# Datos de test para flujos de Login/Sign Up
# Env var: TEST_EMAIL_DOMAIN
test.email.domain=test.com
# Env var: TEST_PASSWORD
test.password=Test1234!